<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox Shop</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --card: #fff; --line: #e3e3de; --accent: #2f6fdb; --bad: #c2362b; --good: #2b8a4b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #ececea; --muted: #9a9a94; --card: #1e1e1c; --line: #2e2e2b; --accent: #6d9cf0; --bad: #ef6a5e; --good: #5cc283; } }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; } p.sub { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #log { margin-top: 24px; font: 13px/1.6 ui-monospace, monospace; }
  .ok { color: var(--good); } .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Sandbox Shop</h1>
  <p class="sub">A small microservice system for trying SentinelGraph + DevBrowser. Every click below is a real request through gateway → services → databases, traced into the graph.</p>
  <div class="grid" id="products">Loading products…</div>
  <p style="margin-top:20px"><button class="primary" id="checkout">Checkout</button> <button id="reload">Reload cart</button></p>
  <div id="log"></div>
</main>
<script>
  const GATEWAY = "{{GATEWAY_URL}}";
  const log = (text, ok) => { const d = document.createElement("div"); d.className = ok ? "ok" : "err"; d.textContent = `${new Date().toLocaleTimeString()}  ${text}`; document.getElementById("log").prepend(d); };
  async function api(method, path, body) {
    const res = await fetch(GATEWAY + path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    log(`${method} ${path} → ${res.status}${data.error ? " " + data.error : ""}`, res.ok);
    return data;
  }
  async function load() {
    const products = await api("GET", "/api/products");
    const grid = document.getElementById("products");
    grid.textContent = "";
    for (const p of Array.isArray(products) ? products : []) {
      const c = document.createElement("div"); c.className = "card";
      c.innerHTML = `<strong></strong><div style="color:var(--muted)"></div><p><button>Add to cart</button></p>`;
      c.querySelector("strong").textContent = p.name; c.querySelector("div").textContent = `$${p.price}`;
      c.querySelector("button").onclick = () => api("POST", "/api/cart", { sku: p.sku });
      grid.append(c);
    }
  }
  document.getElementById("checkout").onclick = () => api("POST", "/api/checkout", {});
  document.getElementById("reload").onclick = () => api("GET", "/api/cart");
  load();
</script>
</body>
</html>
