# The sandbox shop's declared architecture: what SentinelGraph's codebase scan reads to map the system before
# any traffic flows. run_shop.py runs these services in one process; there are no images or Dockerfiles, so this
# file is not meant for `docker compose up`.
x-service: &service
  environment: &env
    SENTINEL_URL: http://host.docker.internal:8200
    ADMIN_TOKEN: ${ADMIN_TOKEN:-sandbox-token}
  command: python app.py

services:
  web:
    <<: *service
    build: ./services/web
    ports: ["7400:8000"]
    environment: { <<: *env, PORT: "8000", GATEWAY_URL: "http://localhost:7401" }
    depends_on: [gateway]
    labels: { sentinel.tier: high }

  gateway:
    <<: *service
    build: ./services/gateway
    ports: ["7401:8000"]
    environment:
      <<: *env
      PORT: "8000"
      CATALOG_URL: http://catalog:8000
      CART_URL: http://cart:8000
      CHECKOUT_URL: http://checkout:8000
    labels: { sentinel.tier: critical, sentinel.revenue_per_min: "900", sentinel.layer: edge }

  catalog:
    <<: *service
    build: ./services/catalog
    ports: ["7402:8000"]
    environment: { <<: *env, PORT: "8000", REDIS_URL: "redis://cache:6379/0" }
    labels: { sentinel.tier: high }

  cart:
    <<: *service
    build: ./services/cart
    ports: ["7403:8000"]
    environment: { <<: *env, PORT: "8000", REDIS_URL: "redis://cache:6379/1" }
    labels: { sentinel.tier: high, sentinel.revenue_per_min: "300" }

  checkout:
    <<: *service
    build: ./services/checkout
    ports: ["7404:8000"]
    environment:
      <<: *env
      PORT: "8000"
      CART_URL: http://cart:8000
      INVENTORY_URL: http://inventory:8000
      PAYMENTS_URL: http://payments:8000
    labels: { sentinel.tier: critical, sentinel.revenue_per_min: "1200" }

  payments:
    <<: *service
    build: ./services/payments
    ports: ["7405:8000"]
    environment: { <<: *env, PORT: "8000", DATABASE_URL: "postgres://shop:shop@orders-db:5432/shop" }
    labels: { sentinel.tier: critical, sentinel.revenue_per_min: "1200" }

  inventory:
    <<: *service
    build: ./services/inventory
    ports: ["7406:8000"]
    environment: { <<: *env, PORT: "8000", DATABASE_URL: "postgres://shop:shop@orders-db:5432/shop" }
    labels: { sentinel.tier: high }

  orders-db:
    image: postgres:16
    environment: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop }

  cache:
    image: redis:7
