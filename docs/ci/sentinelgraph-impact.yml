# Comment on every pull request with which services it touches and what depends on them.
# Copy to .github/workflows/sentinelgraph-impact.yml in YOUR project. It needs no server: it reads the repository and git.
name: SentinelGraph impact

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # the comparison needs the base branch's history
      - uses: actions/checkout@v4
        with:
          repository: MahirPatel2005/graphxDevBrowser
          path: .sentinelgraph
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r .sentinelgraph/backend/requirements.txt
      - name: Work out the impact
        working-directory: .sentinelgraph/backend
        run: |
          python -m sentinel.ingest impact "$GITHUB_WORKSPACE" --base "origin/${{ github.base_ref }}" > "$GITHUB_WORKSPACE/impact.md"
          # To fail the build on a risky change instead of only commenting, add:  --fail-on high
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file impact.md
