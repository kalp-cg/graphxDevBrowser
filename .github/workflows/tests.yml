name: tests

on:
  push:
    branches: [main]
  pull_request:

# The graph tests run against a TigerGraph Cloud instance (graph Sentinel_test), set in the repo secrets
# TG_HOST and TG_SECRET. Runs share that graph, so they never overlap.
concurrency: tigergraph-test-graph

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          TG_HOST: ${{ secrets.TG_HOST }}
          TG_SECRET: ${{ secrets.TG_SECRET }}
